<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family: "微软雅黑",sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card{
            width: 90%;
            max-width: 400px;
            background: #fff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .avatar{
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #409eff;
            margin-bottom: 20px;
        }
        .name{
            font-size: 24px;
            font-weight: 600;
            color: #222;
            margin-bottom: 10px;
        }
        .intro{
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .link-item{
            display: block;
            text-decoration: none;
            color: #fff;
            background: #409eff;
            padding: 12px;
            border-radius: 10px;
            margin: 12px 0;
            transition: 0.3s;
        }
        .link-item:hover{
            background: #2b7cd3;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 替换成自己头像图片链接 -->
        <img class="avatar" src="头像地址" alt="头像">
        <h2 class="name">你的昵称</h2>
        <p class="intro">一句话个人简介 | 前端学习爱好者</p>

        <a href="https://github.com/你的github账号" class="link-item">👉 我的GitHub</a>
        <a href="mailto:你的邮箱@qq.com" class="link-item">📩 联系邮箱</a>
        <a href="#" class="link-item">💬 微信联系方式</a>
    </div>
</body>
</html>
