<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个 GitHub Pages 网站</title>
    <style>
        /* 全局样式，让页面更干净 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* 页面背景和居中布局 */
        body {
            background-color: #f0f8ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 标题样式 */
        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* 段落样式 */
        p {
            color: #34495e;
            font-size: 1.2rem;
            line-height: 1.8;
            max-width: 600px;
            text-align: center;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>你好，世界！👋</h1>
    <p>
        这是我的第一个 GitHub Pages 网页！<br>
        我学会了用 VS Code + Git + GitHub 管理代码，还能把网页发布到网上啦~<br>
        以后我会在这里写更多有趣的内容！
    </p>
</body>
</html>
